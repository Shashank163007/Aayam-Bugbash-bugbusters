<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Phishing Forensics - History Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <header>
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00cc44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <h1>Your Scan History</h1>
      </div>
      <div class="user-actions">
        <span id="user-email"></span>
        <button id="btn-logout" class="btn btn-secondary">Logout</button>
      </div>
    </header>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Total Scans</div><div class="stat-value" id="stat-total">-</div></div>
      <div class="stat-card"><div class="stat-label">High Risk</div><div class="stat-value text-red" id="stat-high">-</div></div>
      <div class="stat-card"><div class="stat-label">Medium Risk</div><div class="stat-value text-amber" id="stat-medium">-</div></div>
      <div class="stat-card"><div class="stat-label">Safe</div><div class="stat-value text-green" id="stat-low">-</div></div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="high">High</button>
      <button class="filter-btn" data-filter="medium">Medium</button>
      <button class="filter-btn" data-filter="low">Safe</button>
      <div style="flex-grow: 1;"></div>
      <button id="btn-clear" class="btn btn-danger">Clear History</button>
    </div>
    <div class="table-container">
      <table id="scans-table">
        <thead><tr><th>Date/Time</th><th>Sender</th><th>Subject</th><th>Risk Level</th><th>Findings</th><th>Action</th></tr></thead>
        <tbody id="scans-tbody"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">No scans found.</div>
    </div>
  </div>
  <div id="report-modal" class="modal">
    <div class="modal-content"><span class="close-modal">&times;</span><div id="modal-body"></div></div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>

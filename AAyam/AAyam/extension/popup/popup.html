<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00cc44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <h2>Phishing Forensics</h2>
    </div>
    
    <div class="controls">
      <div class="control-row">
        <span>Auto-Scan Emails</span>
        <label class="switch">
          <input type="checkbox" id="toggle-scan">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="status-text" id="status-text">Scanner is Active</div>
    </div>
    
    <div class="actions">
      <button id="btn-dashboard" class="btn btn-primary">Open Dashboard</button>
      <button id="btn-logout" class="btn btn-secondary" style="display:none;">Logout</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

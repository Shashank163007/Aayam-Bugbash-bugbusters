<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-container">
    <h2>Welcome to Phishing Forensics</h2>
    <p class="subtitle">Sign in to protect your inbox</p>
    <button id="btn-google" class="btn btn-google">Sign in with Google</button>
    <div class="divider"><span>OR</span></div>
    <div id="error-message" class="error-message"></div>
    <form id="auth-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="btn-submit" class="btn btn-primary">Login</button>
    </form>
    <p class="toggle-mode">
      <span id="toggle-text">Don't have an account?</span> 
      <a href="#" id="toggle-link">Sign up</a>
    </p>
  </div>
  <script src="auth.js"></script>
</body>
</html>
